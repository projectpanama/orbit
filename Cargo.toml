[workspace]
members = ["crates/*"]

[package]
name = "orbit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bitflags = "2.13.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
tracing = { version = "0.1.44", features = ["max_level_debug", "release_max_level_info"] }
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracy-client = { version = "0.19.0", default-features = false }
xcursor = "0.3.11"

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "renderer_multi",
    "wayland_frontend",
]

[features]
profile-with-tracy = ["tracy-client/default"]
