[workspace]
members = ["crates/*"]

[workspace.dependencies.smithay]
git = "https://github.com/Smithay/smithay"
rev = "24647fc8d00131eb7f388efed26e35ea316b0018"
default-features = false

[package]
name = "orbit"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
bitflags = "2.13.2"
orbit-config = { path = "crates/orbit-config" }
orbit-core = { path = "crates/orbit-core" }
orbit-protocols = { path = "crates/orbit-protocols", features = ["server"] }
tiny-skia = "0.12.0"
tracing = { version = "0.1.44", features = ["max_level_debug", "release_max_level_info"] }
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracy-client = { version = "0.19.0", default-features = false }
xcursor = "0.3.11"

[dependencies.smithay]
workspace = true
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "renderer_multi",
    "wayland_frontend",
]

[dev-dependencies]
smithay = { workspace = true, features = ["renderer_pixman"] }

[features]
profile-with-tracy = ["tracy-client/default"]
